<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Iframe Simulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: white;
        }
        h2 { margin: 10px 0; font-size: 16px; color: #888; }
        .portal-container {
            width: 90%;
            height: 85%;
            border: 4px solid #444;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h2>CrazyGames / Portal Iframe Simulator</h2>
    <div class="portal-container">
        <!-- We use allow="autoplay; fullscreen" as portals typically grant these permissions -->
        <iframe src="/" allow="autoplay; fullscreen"></iframe>
    </div>
</body>
</html>
